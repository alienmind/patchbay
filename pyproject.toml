[project]
name = "patchbay"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["lxml"]

[project.scripts]
patchbay = "patchbay.cli:main"

[dependency-groups]
dev = ["pytest", "poethepoet", "ruff", "pyright"]

[tool.poe.tasks]
fetch = "python scripts/fetch_samples.py"
build-examples = "python scripts/build_examples.py"
test = "pytest tests/ -q"
lint = "ruff check . && ruff format --check ."
typecheck = "pyright"
check = ["lint", "typecheck"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

# racks/, donors/, samples/ and specs/ are asset folders, not packages.
# Without this setuptools refuses to build, seeing a flat layout with
# five top-level packages.
[tool.setuptools]
packages = ["patchbay"]

[tool.pyright]
extraPaths = ["examples"]


[tool.ruff]
exclude = ["build", "scratch", ".venv"]

